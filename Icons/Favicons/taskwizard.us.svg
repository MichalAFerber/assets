<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- TaskWizard brand mark: a chat bubble checked off + wizard spark (green).
       Drawn for this site (§1: no stock brand marks), and the favicon
       doubles as the Nav/Footer brand icon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- chat bubble with its tail at the bottom left -->
  <path d="M34 38 H78 a12 12 0 0 1 12 12 V76 a12 12 0 0 1 -12 12 H54 L38 102 V88 H34 a12 12 0 0 1 -12 -12 V50 a12 12 0 0 1 12 -12 Z" fill="#ffffff"/>
  <!-- the check that turns it into a task -->
  <path d="M42 63 L52 73 L71 54" fill="none" stroke="#059669" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wizard spark: four-point star with a small companion -->
  <path d="M101 14 L104.4 24.6 L115 28 L104.4 31.4 L101 42 L97.6 31.4 L87 28 L97.6 24.6 Z" fill="url(#spark)"/>
  <path d="M104 88 L106.2 93.8 L112 96 L106.2 98.2 L104 104 L101.8 98.2 L96 96 L101.8 93.8 Z" fill="#d1fae5" opacity="0.85"/>
</svg>
