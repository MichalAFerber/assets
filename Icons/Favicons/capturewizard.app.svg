<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- CaptureWizard brand mark: viewfinder brackets + wizard spark (teal).
       Master lives in the extension repo (icons/icon.svg); §1: the favicon
       doubles as the Nav/Footer brand icon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- viewfinder corner brackets -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M28 46 V34 a6 6 0 0 1 6 -6 H46"/>
    <path d="M82 28 H94 a6 6 0 0 1 6 6 V46"/>
    <path d="M100 82 V94 a6 6 0 0 1 -6 6 H82"/>
    <path d="M46 100 H34 a6 6 0 0 1 -6 -6 V82"/>
  </g>
  <!-- wizard spark: four-point star with a small companion -->
  <path d="M64 38 L70.5 57.5 L90 64 L70.5 70.5 L64 90 L57.5 70.5 L38 64 L57.5 57.5 Z" fill="url(#spark)"/>
  <path d="M88 40 L90.6 47.4 L98 50 L90.6 52.6 L88 60 L85.4 52.6 L78 50 L85.4 47.4 Z" fill="#cffafe" opacity="0.9"/>
</svg>
