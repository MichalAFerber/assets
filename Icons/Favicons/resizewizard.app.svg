<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a9fe6"/>
      <stop offset="100%" style="stop-color:#4a90d9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>

  <!-- Window frame -->
  <rect x="20" y="20" width="88" height="88" rx="8" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Grid lines (resize indicator) -->
  <line x1="64" y1="28" x2="64" y2="100" stroke="white" stroke-width="4" stroke-dasharray="8,8" opacity="0.5"/>
  <line x1="28" y1="58" x2="100" y2="58" stroke="white" stroke-width="4" stroke-dasharray="8,8" opacity="0.5"/>

  <!-- Resize corner indicator -->
  <path d="M88 100 L100 100 L100 88" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M92 100 L100 100 L100 92" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 94 L100 100 L94 100" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
</svg>
